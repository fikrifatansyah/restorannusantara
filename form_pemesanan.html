<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin: 6px 0 15px;
            box-sizing: border-box;
        }

        .checkbox,
        .radio {
            margin: 8px 0 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Form Pemesanan</h2>

    <form action="#" method="post">

        <!-- Nama -->
        <label>Nama Lengkap</label>
        <input type="text" name="nama" placeholder="Masukkan nama lengkap" required>

        <!-- No HP -->
        <label>No. HP</label>
        <input type="tel" name="no_hp" placeholder="08xxxxxxxxxx" required>

        <!-- Tanggal Booking -->
        <label>Tanggal Booking</label>
        <input type="date" name="tanggal_booking" required>

        <!-- Kategori Menu -->
        <label>Kategori Menu</label>

        <div class="checkbox">
            <input type="checkbox" name="menu[]" value="Makanan">
            Makanan

            <br>

            <input type="checkbox" name="menu[]" value="Minuman">
            Minuman

            <br>

            <input type="checkbox" name="menu[]" value="Dessert">
            Dessert
        </div>

        <!-- Jumlah Item -->
        <label>Jumlah Item</label>
        <input type="number" name="jumlah_item" min="1" placeholder="Masukkan jumlah item" required>

        <!-- Pembayaran -->
        <label>Pilihan Pembayaran</label>

        <div class="radio">
            <input type="radio" name="pembayaran" value="Debit/Kredit" required>
            Kartu Debit/Kredit
            <br>

            <input type="radio" name="pembayaran" value="Dompet Digital">
            Dompet Digital
        </div>

        <!-- Nomor Kartu / Dompet Digital -->
        <label>Nomor Kartu / Dompet Digital</label>
        <input type="text" name="nomor_pembayaran"
               placeholder="Masukkan nomor kartu / e-wallet"
               required>

        <!-- Submit -->
        <button type="submit">Pesan Sekarang</button>

    </form>

</div>

</body>
</html>
